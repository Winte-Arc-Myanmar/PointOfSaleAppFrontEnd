name: visionproduction
services:
  web:
    image: ${APP_IMAGE:?Set APP_IMAGE to a tested production image}
    container_name: visionproduction-web
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8083:3000"
    env_file:
      - /etc/visionproduction/app.env
    environment:
      NODE_ENV: production
      AUTH_URL: https://visionproduction.mmlnkits.com
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_API_URL: https://visionproduction.mmlnkits.com/api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"